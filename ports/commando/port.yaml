  - version: 2026.10.2
    date: 2026-10-30
    changes:
      - Pause menu with options, statistics, practice levels and cheats.
      - Pad buttons can be remapped, and A and B swapped in menus.
      - The left stick works in menus, and music keeps playing quietly there.
      - Fades between frames and a loading screen.
      - Skip level now saves progress, so Continue resumes after the skipped level.
      - Faster on the console, with less stutter.
