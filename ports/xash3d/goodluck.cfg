// goodluckOS gamepad layout, executed after config.cfg on every start.
// Left stick moves, right stick looks, Start opens the menu.
bind A_BUTTON "+jump"
bind B_BUTTON "+use"
bind X_BUTTON "+reload"
bind Y_BUTTON "impulse 100"
bind L1_BUTTON "invprev"
bind R1_BUTTON "invnext"
bind LTRIGGER "+attack2"
bind RTRIGGER "+attack"
bind DPAD_UP "lastinv"
bind DPAD_DOWN "+duck"
bind DPAD_LEFT "savequick"
bind DPAD_RIGHT "loadquick"
bind STICK1 "+speed"
bind STICK2 "+duck"
bind BACK "pause"
hud_fastswitch "1"
