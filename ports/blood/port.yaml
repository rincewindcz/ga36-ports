    - { from: "BLOOD000.DEM to BLOOD003.DEM, GTI.SMK, LOGO.SMK (optional)", to: ports/blood/data/ }
    - { from: "CP*.MAP, CPART07.AR_, CPART15.AR_, CRYPTIC.INI, CRYPTIC.SMK, CRYPTIC.WAV (Cryptic Passage)", to: ports/blood/data/ }

