  license: GPL-3.0-only with the Parallax licence

data:
  kind: included
  license: Descent shareware licence
  credit: Parallax Software
  license_file: ports/descent/shareware/README.TXT

install:
  - "The shareware episode is unpacked from the bundled, unmodified `desc14sw.tar.gz` on the first start."
  - "Full version: copy `descent.hog` and `descent.pig` from the DOS CD, GOG or Steam release to `ports/descent/data/`, replacing the shareware files."

