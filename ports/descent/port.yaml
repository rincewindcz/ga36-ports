title: Descent
catalog: 25
summary: Parallax Software's 1995 six-degrees-of-freedom shooter on D1X-Rebirth, with the shareware episode.
tags: [shooter, 3d]
status: playable
review: draft
accent: teal
added: 2026-11-10
icon: icon.png

engine:
