  - { button: L2, action: "Fire secondary" }
  - { button: L1, action: "Bank left" }
  - { button: R1, action: "Bank right" }
  - { button: A, action: "Menu confirm" }
  - { button: B, action: "Drop bomb; menu back" }
  - { button: X, action: "Rear view" }
  - { button: Y, action: "Fire flare" }
  - { button: dpad, action: "Left/right cycle primary/secondary, down automap; menu navigation" }
  - { button: START, action: "Pause" }
  - { button: SELECT, action: "Menu" }

