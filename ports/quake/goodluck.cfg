// goodluckOS pad layout and handheld defaults, copied to config.cfg by run.sh
// when there is none; the engine rewrites config.cfg on quit. Left stick
// moves, right stick looks, START opens the menu, SELECT shows the scores,
// dpad moves and turns.
bind ABUTTON "+jump"
bind BBUTTON "+movedown"
bind XBUTTON "+speed"
bind YBUTTON "centerview"
bind LSHOULDER "impulse 12"
bind RSHOULDER "impulse 10"
bind LTRIGGER "+jump"
bind RTRIGGER "+attack"
cl_alwaysrun "1"
scr_conscale "2"
scr_menuscale "2"
scr_sbarscale "2"
r_oldwater "1"
joy_sensitivity_yaw "480"
joy_sensitivity_pitch "260"
joy_outer_threshold_look "0.1"
