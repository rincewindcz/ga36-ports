# The device has one PCM and no mixing: FreeJ2ME opens a line per synthesizer.
</usr/share/alsa/alsa.conf>
pcm.!default {
    type plug
    slave.pcm "freej2me"
}
pcm.freej2me {
    type dmix
    ipc_key 36002
    slave {
        pcm "hw:0,0"
        rate 44100
        period_size 1024
        buffer_size 8192
    }
}
