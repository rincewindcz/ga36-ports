# Gates of Skeldal on goodluckOS. Options: see skeldal.ini of the upstream
# repository. Controller buttons are raw GA36-MB joystick buttons:
# 0 B, 1 A, 2 X, 3 Y, 4 L1, 5 R1, 6 L2, 7 R2, 8 Select, 9 Start, 11 L3, 12 R3,
# 13 up, 14 down, 15 left, 16 right. Axes 0, 1 left stick, 2, 3 right stick.

[paths]
root=data
lang=../lang

[video]
fullscreen=on
crt_filter=none
aspect_ratio=4:3

[controller]
enabled=on
button0=rclick
button1=lclick
button2=space
button3=enter
button4=backspace
button5=mod_key
button6=map
button7=ctrl+lclick
button8=F1
button9=F2
button11=merge_group
button12=F7
button13=up
button14=down
button15=turn_left
button16=turn_right
mod+button0=F11
mod+button1=F8
mod+button2=F7
mod+button3=F10
mod+button4=F4
mod+button6=F6
mod+button8=escape
mod+button9=F3
mod+button13=F9
mod+button14=F12
mod+button15=left
mod+button16=right
